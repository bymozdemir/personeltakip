<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa</title>
    <!-- Font Awesome İkon Seti CDN Bağlantısı -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
        }
        a {
            text-decoration: none;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            border: 1px solid #adadad;
            border-radius: 6px;
            box-shadow: 0 4px 0 #b5b5b5, 0 5px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.08s ease;
            
            /* İkon ve metni düzgün hizalamak için flexbox */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* İkon ile yazı arasındaki boşluk */
        }
        button:hover {
            background: linear-gradient(to bottom, #ffffff, #eaeaea);
        }
        button:active {
            background: linear-gradient(to bottom, #d0d0d0, #e0e0e0);
            transform: translateY(4px);
            box-shadow: 0 0 0 #b5b5b5, 0 2px 2px rgba(0, 0, 0, 0.2);
        }
        /* İkonların rengini ve boyutunu ayarlamak için */
        button i {
            font-size: 18px;
            color: #007bff; /* İsterseniz rengini değiştirebilirsiniz */
        }
    </style>
</head>
<body>

    <div class="button-container">
        <!-- Ödeme Takip butonuna cüzdan ikonu eklendi -->
        <a href="odeme/index.html"><button><i class="fa-solid fa-wallet"></i> Ödeme Takip</button></a>
        <!-- İsterseniz personel takip butonuna da ikon ekleyebilirsiniz (örn: fa-users) -->
        <a href="personel/index.html"><button><i class="fa-solid fa-users"></i> Personel Takip</button></a>
    </div>

</body>
</html>
