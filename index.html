<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tim Bilgileri</title>
  
  <style>
    :root {
      --primary: #1e88e5;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --danger: #e53935;
      --success: #43a047;
      --whatsapp: #25D366;
      --save: #ff5722;
      --json-load: #673ab7;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overscroll-behavior-y: contain;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin-top: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background-color: var(--primary);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      flex: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-header {
      background: #ff9800;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .card-body {
      padding: 16px;
      width: 100%;
    }

    .view-section {
      width: 100%;
    }

    .birthday-panel {
      background: #fff8e1;
      border: 1px solid #ffe0b2;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .birthday-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13.5px;
      color: #ef6c00;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .birthday-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 120px;
      overflow-y: auto;
    }

    .birthday-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid #ffe0b2;
    }

    .birthday-item:last-child {
      border-bottom: none;
    }

    .btn-wa-mini {
      background-color: var(--whatsapp);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      text-decoration: none;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      background-color: #fafafa;
    }

    .action-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .action-row {
      display: grid;
      gap: 6px;
      width: 100%;
    }

    .row-top {
      grid-template-columns: repeat(5, 1fr);
    }

    .btn {
      padding: 8px 2px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
    }

    .btn-add { background-color: #00897b; }
    .btn-delete { background-color: var(--danger); }
    .btn-export { background-color: var(--success); }
    .btn-import { background-color: #3f51b5; }
    .btn-location { background-color: var(--whatsapp); }
    .btn-save { background-color: var(--save); }
    .btn-json-load { background-color: var(--json-load); }

    .select-all-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f0f4f8;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .personel-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .personel-item {
      display: flex;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .personel-item:last-child {
      border-bottom: none;
    }

    .personel-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 12px;
    }

    .personel-name {
      flex: 1;
      font-weight: 500;
      font-size: 15px;
      color: #333;
    }

    .arrow {
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
  </style>

  <!-- SheetJS CDN Bağlantısı -->
  <script src="./xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
</head>
<body>

  <div class="app-container">
    <div class="card">
      
      <div class="card-header">
        <button class="btn-header" id="btnLeft" onclick="solButonTiklandi()">Ayarlar</button>
        <h1 id="headerTitle">Personel Listesi</h1>
        <div style="width: 60px;" id="headerRightSpace"></div>
      </div>

      <div class="card-body">
        
        <!-- ANA SAYFA GÖRÜNÜMÜ -->
        <div id="viewMain" class="view-section">
          
          <div id="birthdayPanelContainer" class="birthday-panel" style="display: none;">
            <h4>🎉 Yaklaşan / Bugünkü Özel Günler</h4>
            <ul class="birthday-list" id="birthdayListContent"></ul>
          </div>

          <input type="text" class="search-box" id="searchInput" placeholder="Personel Ara..." oninput="personelAra()">

          <div class="action-bar">
            <div class="action-row row-top">
              <button class="btn btn-add" onclick="yeniPersonelEkle()">➕ Ekle</button>
              <button class="btn btn-delete" onclick="secilileriSil()">🗑️ Sil (<span id="seciliSayisi">0</span>)</button>
              <button class="btn btn-location" onclick="whatsappKonumIste()">📍 Konum</button>
              <button class="btn btn-export" onclick="exportExcel()">📊 Dışa Al</button>
              <button class="btn btn-import" onclick="document.getElementById('excelInput').click()">📥 İçeri Al</button>
              <input type="file" id="excelInput" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none" onchange="importExcel(event)">
            </div>

            <div class="action-row row-bottom" style="grid-template-columns: repeat(3, 1fr);">
              <button class="btn btn-save" onclick="jsonVeritabaninaKaydet()">💾 Kaydet</button>
              <button class="btn btn-export" onclick="yedekOlustur()">🗄️ Yedek Al</button>
              <button class="btn btn-json-load" onclick="dosyaSeciciAc()">♻️ Geri Yükle</button>
              <input type="file" id="jsonInput" accept=".txt,application/json,.json" style="display:none" onchange="jsonDosyasiniIceriAl(event)" />
            </div>
          </div>

          <div class="select-all-bar">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="selectAllCheckbox" onchange="hepsiniSecToggle(this)">
              <span>Hepsini Seç</span>
            </label>
            <span style="color: #666; font-size: 13px;" id="toplamPersonelSayisi">Toplam: 0 Kişi</span>
          </div>

          <ul class="personel-list" id="personelListesi"></ul>
        </div>

        <!-- PERSONEL KATEGORİ MENÜSÜ GÖRÜNÜMÜ -->
        <div id="viewCategories" class="view-section" style="display: none;">
          <div id="kategoriListesi"></div>
        </div>

        <!-- PERSONEL VERİ FORMU GÖRÜNÜMÜ -->
        <div id="viewForm" class="view-section" style="display: none;">
          <div id="formContainer"></div>
          <button onclick="verileriKaydet()" style="background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer;">Formu Kaydet</button>
        </div>

      </div>

    </div>
  </div>

  <!-- AYARLAR MODAL PENCERESİ -->
  <div id="ayarlarModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; width: 95%; max-width: 420px; max-height: 85vh; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <h3 style="margin: 0; font-size: 16px; color: #333;">⚙️ Şablon / Menü Ayarları</h3>
        <button onclick="ayarlarMenuKapat()" style="background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="font-size: 13px; font-weight: bold; color: #555;">Yeni Ana Kategori Ekle:</label>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
          <input type="text" id="yeniAnaKategoriInput" placeholder="Örn: Aile Bilgileri" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
          <button onclick="anaKategoriEkle()" style="background: #1e88e5; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold;">Ekle</button>
        </div>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="font-size: 13px; font-weight: bold; color: #555;">Yeni Alt Kategori Ekle:</label>
        <select id="anaKategoriSecici" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; margin-bottom: 5px;"></select>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="yeniAltKategoriInput" placeholder="Örn: Eş / Çocuk" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
          <button onclick="altKategoriEkle()" style="background: #43a047; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold;">Ekle</button>
        </div>
      </div>

      <div style="flex: 1; border-top: 1px solid #eee; padding-top: 10px;">
        <label style="font-size: 13px; font-weight: bold; color: #555;">Mevcut Şablon Yapısı ve Alanlar:</label>
        <div id="sablonListesiContainer" style="margin-top: 8px; font-size: 13px;"></div>
      </div>

      <button onclick="ayarlarMenuKapat()" style="background: #666; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 15px; width: 100%;">Kapat</button>
    </div>
  </div>

  <script>
    let personeller = JSON.parse(localStorage.getItem('personeller')) || [];
    let sablon = JSON.parse(localStorage.getItem('sablon')) || {};

    if (Object.keys(sablon).length === 0) {
      sablon = {
        "Genel Bilgiler": {
          "Kişisel Bilgiler": ["Telefon", "Doğum Tarihi"]
        },
        "Özel Günler": {
          "Doğum Günleri": ["Kendi Doğum Tarihi", "Eş Doğum Tarihi", "Çocuk Doğum Tarihi"]
        }
      };
    }

    let seciliPersonelIds = new Set();
    let aktifPersonelId = null;
    let aktifAnaKategori = null;
    let aktifAltKategori = null;

    function özelBildirimGoster(mesaj) {
      let modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); display: flex; align-items: center;
        justify-content: center; z-index: 9999;
      `;
      modal.innerHTML = `
        <div style="background: white; padding: 20px; border-radius: 12px; max-width: 80%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
          <p style="margin-top:0; font-size: 15px; color: #333; line-height: 1.4; white-space: pre-wrap;">${mesaj}</p>
          <button onclick="this.parentElement.parentElement.remove()" style="background: #1e88e5; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Tamam</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        const savedData = localStorage.getItem('personeller');
        if (savedData) personeller = JSON.parse(savedData);
        
        const savedSablon = localStorage.getItem('sablon');
        if (savedSablon) sablon = JSON.parse(savedSablon);
      } catch (e) {
        console.error("Local storage verisi bozuk, sıfırlanıyor:", e);
        localStorage.clear();
      }

      if (!history.state) {
        history.replaceState({ ekran: 'main' }, "");
      }

      let savedState = sessionStorage.getItem('appState');
      if (savedState) {
        try {
          let stateData = JSON.parse(savedState);
          if (stateData.ekran === 'categories' && stateData.personelId) {
            aktifPersonelId = stateData.personelId;
            gorselKategoriEkraniGoster(false);
            personelDetayAc(aktifPersonelId, true);
          } else if (stateData.ekran === 'form' && stateData.personelId && stateData.k1 && stateData.k2) {
            aktifPersonelId = stateData.personelId;
            gorselKategoriEkraniGoster(false);
            personelDetayAc(aktifPersonelId, true);
            formEkraniAc(stateData.k1, stateData.k2, true);
          } else {
            gorselAnaSayfaGoster(false);
          }
        } catch(err) {
          gorselAnaSayfaGoster(false);
        }
      } else {
        gorselAnaSayfaGoster(false);
      }
    });

    window.addEventListener('popstate', (event) => {
      let modal = document.getElementById('ayarlarModal');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
        return;
      }

      let viewForm = document.getElementById('viewForm').style.display === 'block';
      let viewCategories = document.getElementById('viewCategories').style.display === 'block';

      if (viewForm) {
        document.getElementById('viewForm').style.display = 'none';
        document.getElementById('viewCategories').style.display = 'block';
        let p = personeller.find(x => x.id === aktifPersonelId);
        document.getElementById('headerTitle').innerText = p ? p.adSoyad : "Personel Detay";
        document.getElementById('btnLeft').innerText = "‹ Geri";
        sessionStorage.setItem('appState', JSON.stringify({ ekran: 'categories', personelId: aktifPersonelId }));
      } else if (viewCategories) {
        gorselAnaSayfaGoster(false);
      } else {
        window.history.back();
      }
    });

    function kaydetLocal() {
      try {
        localStorage.setItem('personeller', JSON.stringify(personeller));
        localStorage.setItem('sablon', JSON.stringify(sablon));
      } catch (e) {
        özelBildirimGoster("Kayıt başarısız! Hafıza dolu olabilir.");
      }
    }

    function jsonVeritabaninaKaydet() {
      kaydetLocal();
      özelBildirimGoster("Tüm veriler cihaz hafızasına kaydedildi.");
    }

    function dosyaSeciciAc() {
      const input = document.getElementById('jsonInput');
      input.value = '';
      setTimeout(() => { input.click(); }, 50);
    }

    // YEDEK DOSYASINI MEVCUT LİSTEYE EKLEME (BİRLEŞTİRME) FONKSİYONU
    function jsonDosyasiniIceriAl(event) {
      let file = event.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(e) {
        let dosyaIcerigi = e.target.result;
        try {
          let parsedData = JSON.parse(dosyaIcerigi);
          
          let yuklenecekPersoneller = null;

          // 1. Durum: Dosya doğrudan personel dizisi mi?
          if (Array.isArray(parsedData)) {
            yuklenecekPersoneller = parsedData;
          } 
          // 2. Durum: Dosya sarmalanmış nesne mi?
          else if (parsedData && typeof parsedData === 'object') {
            if (Array.isArray(parsedData.personeller)) {
              yuklenecekPersoneller = parsedData.personeller;
            }
          }

          if (!yuklenecekPersoneller || yuklenecekPersoneller.length === 0) {
            throw new Error("Yedek dosyasında geçerli personel kaydı bulunamadı.");
          }

          let eklenenSayisi = 0;
          let atlananSayisi = 0;

          // Mevcut listeyi koruyarak yedekteki kişileri tarıyoruz
          yuklenecekPersoneller.forEach(yedekKisi => {
            // Çift kayıt olmasın diye ID veya isim kontrolü yapalım
            let zatenVarMi = personeller.some(p => p.id === yedekKisi.id || (p.adSoyad && yedekKisi.adSoyad && p.adSoyad.toLowerCase() === yedekKisi.adSoyad.toLowerCase()));

            if (!zatenVarMi) {
              personeller.push(yedekKisi);
              eklenenSayisi++;
            } else {
              atlananSayisi++;
            }
          });
          
          kaydetLocal();
          personelListesiniCiz();
          ozelGunleriKontrolEtVeGoster();
          event.target.value = '';
          
          özelBildirimGoster(`Yedek başarıyla birleştirildi!\n• Eklenen Yeni Kişi: ${eklenenSayisi}\n• Zaten Listede Olan (Atlanan): ${atlananSayisi}`);
        } catch (err) {
          özelBildirimGoster("JSON dosyası okunurken hata oluştu: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function solButonTiklandi() {
      let modal = document.getElementById('ayarlarModal');
      if (modal.style.display === 'flex') {
        ayarlarMenuKapat();
        return;
      }

      let viewCategories = document.getElementById('viewCategories').style.display === 'block';
      let viewForm = document.getElementById('viewForm').style.display === 'block';

      if (viewForm) {
        document.getElementById('viewForm').style.display = 'none';
        document.getElementById('viewCategories').style.display = 'block';
        let p = personeller.find(x => x.id === aktifPersonelId);
        document.getElementById('headerTitle').innerText = p ? p.adSoyad : "Personel Detay";
        document.getElementById('btnLeft').innerText = "‹ Geri";
        sessionStorage.setItem('appState', JSON.stringify({ ekran: 'categories', personelId: aktifPersonelId }));
      } else if (viewCategories) {
        gorselAnaSayfaGoster(true);
      } else {
        ayarlarMenuAc();
      }
    }

    function gorselAnaSayfaGoster(pushHistory = true) {
      sessionStorage.setItem('appState', JSON.stringify({ ekran: 'main' }));
      document.getElementById('viewMain').style.display = 'block';
      document.getElementById('viewCategories').style.display = 'none';
      document.getElementById('viewForm').style.display = 'none';

      document.getElementById('headerTitle').innerText = "Personel Listesi";
      let btnLeft = document.getElementById('btnLeft');
      btnLeft.innerText = "Ayarlar";
      btnLeft.style.backgroundColor = "#ff9800";
      
      aktifPersonelId = null;
      personelListesiniCiz();
      ozelGunleriKontrolEtVeGoster();

      if (pushHistory) {
        history.pushState({ ekran: 'main' }, "");
      }
    }

    function gorselKategoriEkraniGoster(pushHistory = true) {
      sessionStorage.setItem('appState', JSON.stringify({ ekran: 'categories', personelId: aktifPersonelId }));
      document.getElementById('viewMain').style.display = 'none';
      document.getElementById('viewCategories').style.display = 'block';
      document.getElementById('viewForm').style.display = 'none';

      let p = personeller.find(x => x.id === aktifPersonelId);
      document.getElementById('headerTitle').innerText = p ? p.adSoyad : "Personel Detay";
      let btnLeft = document.getElementById('btnLeft');
      btnLeft.innerText = "‹ Geri";
      btnLeft.style.backgroundColor = "rgba(255,255,255,0.2)";

      if (pushHistory) {
        history.pushState({ ekran: 'categories', personelId: aktifPersonelId }, "");
      }
    }

    function ozelGunleriKontrolEtVeGoster() {
      const panel = document.getElementById('birthdayPanelContainer');
      const listContent = document.getElementById('birthdayListContent');
      listContent.innerHTML = "";

      let yakinGunler = [];
      let bugun = new Date();
      let yarin = new Date();
      yarin.setDate(bugun.getDate() + 1);
      
      let yarinGun = yarin.getDate();
      let yarinAy = yarin.getMonth() + 1;

      personeller.forEach(p => {
        if (!p.veriler) return;

        let personelTel = "";
        Object.keys(p.veriler).forEach(kKey => {
          if (p.veriler[kKey] && p.veriler[kKey][0]) {
            Object.keys(p.veriler[kKey][0]).forEach(field => {
              if (field.toLowerCase().includes('telefon')) {
                personelTel = p.veriler[kKey][0][field];
              }
            });
          }
        });

        Object.keys(p.veriler).forEach(mainKey => {
          let kayitlar = p.veriler[mainKey];
          if (!Array.isArray(kayitlar)) return;

          kayitlar.forEach(kayit => {
            Object.keys(kayit).forEach(alanAdi => {
              let deger = kayit[alanAdi];
              if (!deger) return;

              let parsedDate = parseTarih(deger);
              if (parsedDate) {
                if (parsedDate.gun === yarinGun && parsedDate.ay === yarinAy) {
                  yakinGunler.push({
                    isim: p.adSoyad,
                    etkinlik: alanAdi,
                    telefon: personelTel,
                    metin: `${yarinGun}.${yarinAy} (Yarın) ${p.adSoyad} (${alanAdi})`
                  });
                }
              }
            });
          });
        });
      });

      if (yakinGunler.length > 0) {
        panel.style.display = 'block';
        yakinGunler.forEach(item => {
          let li = document.createElement('li');
          li.className = 'birthday-item';
          
          let temizTel = item.telefon ? item.telefon.replace(/\D/g, '') : '';
          let waButtonHtml = "";
          
          if (temizTel) {
            if (temizTel.startsWith('0') && temizTel.length === 11) temizTel = '90' + temizTel.substring(1);

    function parseTarih(val) {
      if (!val) return null;
      val = val.toString().trim();
      let parts = val.split(/[.\/\\-]/);
      if (parts.length >= 2) {
        let g = parseInt(parts[0], 10);
        let a = parseInt(parts[1], 10);
        if (!isNaN(g) && !isNaN(a) && g >= 1 && g <= 31 && a >= 1 && a <= 12) {
          return { gun: g, ay: a };
        }
      }
      return null;
    }

      if (seciliPersonelIds.size === 0) {
        return özelBildirimGoster("Lütfen konum istemek için en az bir personel seçin!");
      }

      let seciliId = Array.from(seciliPersonelIds)[0];
      let p = personeller.find(x => x.id === seciliId);
      let tel = "";

      if (p && p.veriler) {
        Object.keys(p.veriler).forEach(key => {
          if (p.veriler[key] && p.veriler[key][0]) {
            Object.keys(p.veriler[key][0]).forEach(field => {
              if (field.toLowerCase().includes('telefon')) {
                tel = p.veriler[key][0][field];
              }
            });
          }
        });
      }

      if (!tel) {
        return özelBildirimGoster(`${p.adSoyad} isimli personelin telefon numarası kayıtlarda bulunamadı!`);
      }

      let temizTel = tel.replace(/\D/g, '');

      if (temizTel.startsWith('90') && temizTel.length === 12) {
      } else if (temizTel.startsWith('0') && temizTel.length === 11) {
        temizTel = '90' + temizTel.substring(1);
      } else if (temizTel.length === 10) {
        temizTel = '90' + temizTel;
      } else {
        return özelBildirimGoster('Telefon numarası geçersiz: ' + tel);
      }

      let mesaj = encodeURIComponent(`Merhaba ${p.adSoyad}, lütfen güncel canlı konumunuzu bu sohbet üzerinden paylaşabilir misiniz?`);

    }

    function anaKategoriDuzenle(eskiAd) {
      let yeniAd = prompt("Yeni ana kategori adını girin:", eskiAd);
      if (!yeniAd || yeniAd.trim() === "" || yeniAd === eskiAd) return;
      yeniAd = yeniAd.trim();
      if (sablon[yeniAd]) return özelBildirimGoster("Bu isimde bir ana kategori zaten var.");

      sablon[yeniAd] = sablon[eskiAd];
      delete sablon[eskiAd];

      personeller.forEach(p => {
        if (p.veriler) {
          Object.keys(sablon[yeniAd]).forEach(k2 => {
            let eskiKey = `${eskiAd}_${k2}`;
            let yeniKey = `${yeniAd}_${k2}`;
            if (p.veriler[eskiKey]) {
              p.veriler[yeniKey] = p.veriler[eskiKey];
              delete p.veriler[eskiKey];
            }
          });
        }
      });

      kaydetLocal();
      sablonListesiniCiz();
      özelBildirimGoster("Ana kategori adı başarıyla güncellendi.");
    }

    function altKategoriDuzenle(k1, eskiAd) {
      let yeniAd = prompt("Yeni alt kategori adını girin:", eskiAd);
      if (!yeniAd || yeniAd.trim() === "" || yeniAd === eskiAd) return;
      yeniAd = yeniAd.trim();
      if (sablon[k1][yeniAd]) return özelBildirimGoster("Bu isimde bir alt kategori zaten var.");

      sablon[k1][yeniAd] = sablon[k1][eskiAd];
      delete sablon[k1][eskiAd];

      let eskiKey = `${k1}_${eskiAd}`;
      let yeniKey = `${k1}_${yeniAd}`;
      personeller.forEach(p => {
        if (p.veriler && p.veriler[eskiKey]) {
          p.veriler[yeniKey] = p.veriler[eskiKey];
          delete p.veriler[eskiKey];
        }
      });

      kaydetLocal();
      sablonListesiniCiz();
      özelBildirimGoster("Alt kategori adı başarıyla güncellendi.");
    }

    function alanDuzenle(k1, k2, eskiAd) {
      let yeniAd = prompt("Yeni alan adını girin:", eskiAd);
      if (!yeniAd || yeniAd.trim() === "" || yeniAd === eskiAd) return;
      yeniAd = yeniAd.trim();

      let index = sablon[k1][k2].indexOf(eskiAd);
      if (index === -1) return;
      if (sablon[k1][k2].includes(yeniAd)) return özelBildirimGoster("Bu isimde bir alan zaten var.");

      sablon[k1][k2][index] = yeniAd;

      let mainKey = `${k1}_${k2}`;
      personeller.forEach(p => {
        if (p.veriler && p.veriler[mainKey]) {
          p.veriler[mainKey].forEach(kayit => {
            if (kayit[eskiAd] !== undefined) {
              kayit[yeniAd] = kayit[eskiAd];
              delete kayit[eskiAd];
            }
          });
        }
      });

      kaydetLocal();
      sablonListesiniCiz();
      özelBildirimGoster("Alan adı başarıyla güncellendi.");
    }

    function alanSil(k1, k2, alanAd) {
      if (confirm(`'${alanAd}' alanını silmek istediğinize emin misiniz? Bu alanın kullanıldığı tüm personel verileri silinir.`)) {
        sablon[k1][k2] = sablon[k1][k2].filter(a => a !== alanAd);
        
        let mainKey = `${k1}_${k2}`;
        personeller.forEach(p => {
          if (p.veriler && p.veriler[mainKey]) {
            p.veriler[mainKey].forEach(kayit => {
              if (kayit[alanAd] !== undefined) {
                delete kayit[alanAd];
              }
            });
          }
        });

        kaydetLocal();
        sablonListesiniCiz();
      }
    }

    }

    function anaKategoriSil(k1) {
      if (confirm(`'${k1}' kategorisini silmek istediğinize emin misiniz?`)) {
        delete sablon[k1];
        kaydetLocal();
        sablonListesiniCiz();
      }
    }

    function altKategoriSil(k1, k2) {
      if (confirm(`'${k2}' alt başlığını silmek istediğinize emin misiniz?`)) {
        delete sablon[k1][k2];
        kaydetLocal();
        sablonListesiniCiz();
      }
    }

    function yedekOlustur() {
      try {
        let yedek = {
          personeller: personeller,
          sablon: sablon,
          tarih: new Date().toLocaleString("tr-TR"),
          uygulama: "Tim Bilgileri Mobil"
        };

        let json = JSON.stringify(yedek, null, 2);
        let blob = new Blob([json], { type: "application/json" });
        let url = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = url;
        a.download = "tim_bilgileri_yedek.txt";
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);

        özelBildirimGoster("Yedek dosyası indirildi.");
      } catch (e) {
        özelBildirimGoster("Yedek oluşturulurken hata oluştu: " + e.message);
      }
    }

    function exportExcel() {
      if (typeof XLSX === 'undefined') return özelBildirimGoster("Excel kütüphanesi yüklenemedi. Lütfen internet bağlantınızı kontrol edin.");
      if (seciliPersonelIds.size === 0) return özelBildirimGoster("Dışa aktarmak için en az bir personel seçin!");

      let maxKayitSayilari = {};
      Object.keys(sablon).forEach(k1 => {
        Object.keys(sablon[k1]).forEach(k2 => {
          let mainKey = `${k1}_${k2}`;
          let maxCount = 1;

          personeller.forEach(p => {
            if (seciliPersonelIds.has(p.id) && p.veriler && p.veriler[mainKey]) {
              if (p.veriler[mainKey].length > maxCount) maxCount = p.veriler[mainKey].length;
            }
          });
          maxKayitSayilari[mainKey] = maxCount;
        });
      });

      let sutunHaritasi = [
        { header: 'ID', isStatic: true, key: 'id' },
        { header: 'Adı Soyadı', isStatic: true, key: 'adSoyad' }
      ];

      Object.keys(sablon).forEach(k1 => {
        Object.keys(sablon[k1]).forEach(k2 => {
          let mainKey = `${k1}_${k2}`;
          let alanlar = sablon[k1][k2] || [];
          let tekrarSayisi = maxKayitSayilari[mainKey] || 1;

          for (let i = 0; i < tekrarSayisi; i++) {
            alanlar.forEach(alan => {
              let baslikSuffix = tekrarSayisi > 1 ? ` ${i + 1}` : '';
              sutunHaritasi.push({
                header: `${alan}${baslikSuffix} (${k2})`,
                mainKey: mainKey,
                index: i,
                alan: alan
              });
            });
          }
        });
      });

      let excelMatris = [];
      excelMatris.push(sutunHaritasi.map(s => s.header));

      personeller.forEach(p => {
        if (seciliPersonelIds.has(p.id)) {
          let satir = [];
          sutunHaritasi.forEach(s => {
            if (s.isStatic) {
              satir.push(p[s.key] !== undefined ? p[s.key] : '');
            } else {
              let kayitListesi = p.veriler ? p.veriler[s.mainKey] : null;
              if (kayitListesi && kayitListesi[s.index] && kayitListesi[s.index][s.alan] !== undefined) {
                satir.push(kayitListesi[s.index][s.alan]);
              } else {
                satir.push('');
              }
            }
          });
          excelMatris.push(satir);
        }
      });

      let ws = XLSX.utils.aoa_to_sheet(excelMatris);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Personel Listesi");

      try {
        const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);

        let a = document.createElement('a');
        a.href = url;
        a.download = 'Personel_Detayli_Liste.xlsx';
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);

        özelBildirimGoster('Excel dosyası indirildi.');
      } catch(e) {
        özelBildirimGoster('Dışa aktarma hatası: ' + e.message);
      }
    }

    function importExcel(event) {
      if (typeof XLSX === 'undefined') {
        return özelBildirimGoster("Excel kütüphanesi (XLSX) yüklenemedi. Lütfen internet bağlantınızı kontrol edin.");
      }

      let file = event.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(e) {
        try {
          let data = new Uint8Array(e.target.result);
          let workbook = XLSX.read(data, { type: 'array' });
          let firstSheetName = workbook.SheetNames[0];
          let worksheet = workbook.Sheets[firstSheetName];
          let json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (json.length < 2) return özelBildirimGoster("Dosya boş veya geçersiz format.");

          let basliklar = json[0];
          let eklenenSayisi = 0;
          let guncellenenSayisi = 0;

          let adSoyadIndex = basliklar.findIndex(b => b && b.toString().trim().toLowerCase().includes('ad'));
          let idIndex = basliklar.findIndex(b => b && b.toString().trim().toLowerCase() === 'id');
          if (adSoyadIndex === -1) adSoyadIndex = 1;

          basliklar.forEach((baslik, colIdx) => {
            if (colIdx === idIndex || colIdx === adSoyadIndex || !baslik) return;
            let match = baslik.toString().match(/(.*)\((.*)\)/);
            if (match) {
              let hamAlanAdi = match[1].trim();
              let altKatAdi = match[2].trim();
              let alanAdi = hamAlanAdi.replace(/\s+\d+$/, '').trim();

              let bulunanAnaKat = null;
              Object.keys(sablon).forEach(k1 => {
                if (sablon[k1][altKatAdi]) bulunanAnaKat = k1;
              });

              if (!bulunanAnaKat) {
                if (!sablon['Genel Bilgiler']) {
                  sablon['Genel Bilgiler'] = {};
                }
                bulunanAnaKat = 'Genel Bilgiler';
              }

              if (!sablon[bulunanAnaKat][altKatAdi]) {
                sablon[bulunanAnaKat][altKatAdi] = [];
              }

              if (!sablon[bulunanAnaKat][altKatAdi].includes(alanAdi)) {
                sablon[bulunanAnaKat][altKatAdi].push(alanAdi);
              }
            }
          });

          for (let i = 1; i < json.length; i++) {
            let satir = json[i];
            if (!satir || satir.length === 0) continue;

            let adSoyadVal = satir[adSoyadIndex] ? satir[adSoyadIndex].toString().trim() : '';
            if (!adSoyadVal) continue;

            let excelId = (idIndex !== -1 && satir[idIndex]) ? Number(satir[idIndex]) : null;
            let mevcutPersonel = personeller.find(p => p.adSoyad.toLowerCase() === adSoyadVal.toLowerCase());

            if (!mevcutPersonel) {
              let idCakismasiVarMi = excelId && personeller.some(p => p.id === excelId);
              let atanacakId = (excelId && !idCakismasiVarMi) ? excelId : (Date.now() + i);

              mevcutPersonel = { id: atanacakId, adSoyad: adSoyadVal, veriler: {} };
              personeller.push(mevcutPersonel);
              eklenenSayisi++;
            } else {
              guncellenenSayisi++;
            }

            basliklar.forEach((baslik, colIdx) => {
              if (colIdx === idIndex || colIdx === adSoyadIndex || !baslik) return;
              let val = satir[colIdx] !== undefined ? satir[colIdx].toString().trim() : '';
              if (!val) return;

              let match = baslik.toString().match(/(.*)\((.*)\)/);
              if (match) {
                let hamAlanAdi = match[1].trim();
                let altKatAdi = match[2].trim();
                let alanAdi = hamAlanAdi.replace(/\s+\d+$/, '').trim();

                Object.keys(sablon).forEach(k1 => {
                  if (sablon[k1][altKatAdi]) {
                    let mainKey = `${k1}_${altKatAdi}`;
                    if (!mevcutPersonel.veriler) mevcutPersonel.veriler = {};
                    if (!mevcutPersonel.veriler[mainKey]) {
                      mevcutPersonel.veriler[mainKey] = [{}];
                    }
                    mevcutPersonel.veriler[mainKey][0][alanAdi] = val;
                  }
                });
              }
            });
          }

          kaydetLocal();
          personelListesiniCiz();
          ozelGunleriKontrolEtVeGoster();
          event.target.value = '';
          özelBildirimGoster(`${eklenenSayisi} yeni personel eklendi, ${guncellenenSayisi} personel güncellendi.\nMenü ve şablonlar Excel başlıklarından otomatik yapılandırıldı.`);
        } catch (err) {
          özelBildirimGoster("Excel işlenirken hata oluştu: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
